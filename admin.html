<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة ملف الطالب | مركز الشاعر السنغامبي</title>
<style>
:root{--ink:#17213b;--muted:#667085;--bg:#f4f6fa;--card:#fff;--line:#e5e7eb;--ok:#087443;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#182230}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#17213b,#263a69);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:20}.topin{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{font-size:20px;margin:0}.brand p{margin:5px 0 0;opacity:.75;font-size:12px}.top button{background:#fff1;border:1px solid #ffffff44;color:#fff;border-radius:10px;padding:9px 13px}
.wrap{max-width:1400px;margin:22px auto;padding:0 16px}.login{max-width:440px;margin:70px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 10px 35px #0001}.login h2{text-align:center;margin-top:0}.login input{display:block;width:100%;padding:13px;margin:10px 0;border:1px solid #ccd2da;border-radius:9px;box-sizing:border-box}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--ink);color:#fff}.light{background:#eef2f7;color:#17213b}.danger{background:#fee4e2;color:var(--danger)}.success{background:#dcfae6;color:var(--ok)}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:11px;border:1px solid #d0d5dd;border-radius:10px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.table th{background:#f8fafc}.table tr:hover td{background:#fafcff}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.panel h3{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px}.toast{position:fixed;bottom:18px;left:18px;background:#17213b;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:99}.modal{position:fixed;inset:0;background:#0008;z-index:50;overflow:auto;padding:20px}.modalbox{max-width:1050px;margin:20px auto;background:#fff;border-radius:20px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tab{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.tab.active{background:var(--ink);color:#fff}.mini{font-size:12px;color:var(--muted)}.linkbox{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:10px;margin:8px 0}.linkbox code{direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.topin{align-items:flex-start}.brand h1{font-size:16px}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><h1>مركز الشاعر السنغامبي للغة والشعر</h1><p>لوحة إدارة الملفات الرقمية للطلاب</p></div><button id="logout" class="hidden">تسجيل الخروج</button></div></header>
<main class="wrap">
<section id="login" class="login"><h2>دخول الإدارة</h2><p class="mini">استخدم حساب الإدارة المصرح له في Supabase.</p>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password"></div>
<button class="btn primary" style="width:100%" onclick="login()">دخول</button><p id="loginErr" style="color:#b42318"></p></section>
<section id="app" class="hidden">
<div class="stats"><div class="stat"><b id="sStudents">0</b><span>إجمالي الطلاب</span></div><div class="stat"><b id="sActive">0</b><span>الطلاب النشطون</span></div><div class="stat"><b id="sAttend">0</b><span>سجلات الحضور</span></div><div class="stat"><b id="sAch">0</b><span>الإنجازات</span></div></div>
<div class="toolbar"><input id="search" placeholder="ابحث باسم الطالب أو رقم الملف أو الهاتف..." oninput="renderStudents()"><select id="levelFilter" onchange="renderStudents()"><option value="">جميع المستويات</option></select><button class="btn primary" onclick="newStudent()">＋ طالب جديد</button><button class="btn light" onclick="loadAll()">↻ تحديث</button></div>
<div class="tablewrap"><table class="table"><thead><tr><th>الطالب</th><th>رقم الملف</th><th>المستوى</th><th>المسارات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="studentsBody"></tbody></table></div>
</section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div><h2 id="mTitle" style="margin:0"></h2><div id="mCode" class="mini"></div></div><button class="btn light" onclick="closeModal()">إغلاق</button></div><div class="tabs"><button class="tab active" onclick="tab('profile',this)">البيانات</button><button class="tab" onclick="tab('results',this)">النتائج</button><button class="tab" onclick="tab('attendance',this)">الحضور</button><button class="tab" onclick="tab('achievements',this)">الإنجازات</button><button class="tab" onclick="tab('progress',this)">التقدم</button><button class="tab" onclick="tab('notes',this)">الملاحظات</button><button class="tab" onclick="tab('share',this)">رابط الطالب</button></div><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const URL_BASE="https://marxsmnibmfjpvpwscvo.supabase.co", KEY="sb_publishable_6xBkdRNXh1nTMuDVTywW2g_xGQeAilm", API=URL_BASE+"/functions/v1/center-admin-api-v3", SHARE=URL_BASE+"/functions/v1/student-share";
let token="",students=[],levels=[],current=null,currentData=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const api=async(path,opt={})=>{const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"حدث خطأ");return d};
async function login(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;try{const r=await fetch(URL_BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||"بيانات الدخول غير صحيحة");token=d.access_token;localStorage.center_admin_token=token;await start()}catch(e){document.getElementById("loginErr").textContent=e.message}}
async function start(){try{await api("/me");document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("logout").classList.remove("hidden");await loadAll()}catch(e){localStorage.removeItem("center_admin_token");token="";document.getElementById("loginErr").textContent=e.message}}
async function loadAll(){try{const d=await api("/dashboard");document.getElementById("sStudents").textContent=d.students;document.getElementById("sAttend").textContent=d.attendance_records;document.getElementById("sAch").textContent=d.achievements;const l=await api("/levels");levels=l.data||[];document.getElementById("levelFilter").innerHTML='<option value="">جميع المستويات</option>'+levels.map(x=>'<option value="'+x.id+'">'+esc(x.name_ar)+'</option>').join("");const st=await api("/students");students=st.data||[];document.getElementById("sActive").textContent=students.filter(x=>x.is_active).length;renderStudents()}catch(e){toast(e.message)}}
function renderStudents(){const q=document.getElementById("search").value.trim().toLowerCase(),lf=document.getElementById("levelFilter").value;const a=students.filter(x=>(!lf||x.level_id===lf)&&(!q||[x.full_name,x.student_code,x.phone,x.country].join(" ").toLowerCase().includes(q)));document.getElementById("studentsBody").innerHTML=a.length?a.map(x=>'<tr><td><b>'+esc(x.full_name)+'</b><div class="mini">'+esc(x.phone||"")+'</div></td><td>'+esc(x.student_code||"—")+'</td><td>'+esc(x.level_name||"—")+'</td><td>'+esc((x.selected_tracks||[]).join("، ")||"—")+'</td><td><span class="pill">'+(x.is_active?"نشط":"غير نشط")+'</span></td><td><button class="btn primary" onclick="openStudent(\''+x.id+'\')">فتح الملف</button></td></tr>').join(""):'<tr><td colspan="6" class="empty">لا توجد نتائج.</td></tr>'}
async function openStudent(id){try{current=id;const d=await api("/student/"+id);currentData=d;document.getElementById("mTitle").textContent=d.data.full_name;document.getElementById("mCode").textContent="رقم الملف: "+(d.data.student_code||"—");document.getElementById("modal").classList.remove("hidden");tab("profile",document.querySelector(".tab"));}catch(e){toast(e.message)}}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function tab(name,btn){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");const c=document.getElementById("modalContent");if(name==="profile")profileTab(c);if(name==="results")resultsTab(c);if(name==="attendance")attendanceTab(c);if(name==="achievements")achTab(c);if(name==="progress")progressTab(c);if(name==="notes")notesTab(c);if(name==="share")shareTab(c)}
function field(k,l,v,t="input"){if(t==="select")return '<div class="field"><label>'+l+'</label><select id="f_'+k+'">'+levels.map(z=>'<option value="'+z.id+'" '+(z.id===v?"selected":"")+'>'+esc(z.name_ar)+'</option>').join("")+'</select></div>';return '<div class="field"><label>'+l+'</label><'+(t==="textarea"?"textarea":"input")+' id="f_'+k+'">'+esc(v||"")+'</'+(t==="textarea"?"textarea":"input")+'></div>'}
function tracksField(selected){const opts=["المسار الأول: النحو والصرف والبلاغة","المسار الثاني: الخط والإملاء ومهارة التحدث والإلقاء","المسار الثالث: العروض والشعر والنقد والكتابة الإبداعية"];return '<div class="field" style="grid-column:1/-1"><label>المسارات المختارة (يمكن اختيار مسارين في الوقت نفسه)</label><div style="display:grid;gap:8px;margin-top:8px">'+opts.map(o=>'<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="trackChoice" value="'+o+'" '+(selected.includes(o)?"checked":"")+'>'+o+'</label>').join("")+'</div></div>'}
function profileTab(c){const x=currentData.data;c.innerHTML='<div class="grid2">'+field("full_name","الاسم الكامل",x.full_name)+field("student_code","رقم الملف",x.student_code)+field("email","البريد الإلكتروني",x.email)+field("phone","الهاتف",x.phone)+field("country","الدولة",x.country)+field("city","المدينة",x.city)+field("prior_education","التعليم السابق",x.prior_education)+field("primary_track","المسار الأساسي",x.primary_track)+tracksField(x.selected_tracks||[])+field("level_id","المستوى",x.level_id,"select")+field("gender","الجنس",x.gender)+field("application_reason","سبب التسجيل",x.application_reason,"textarea")+field("center_reason","سبب اختيار المركز",x.center_reason,"textarea")+field("admin_notes","ملاحظات الإدارة",x.admin_notes,"textarea")+'</div><div style="margin-top:14px"><button class="btn primary" onclick="saveProfile()">حفظ التغييرات</button></div>'}
async function saveProfile(){const b={};["full_name","student_code","email","phone","country","city","prior_education","primary_track","application_reason","center_reason","admin_notes","gender"].forEach(k=>b[k]=document.getElementById("f_"+k).value);b.selected_tracks=[...document.querySelectorAll(".trackChoice:checked")].map(x=>x.value);b.level_id=document.getElementById("f_level_id").value;try{const d=await api("/student/"+current,{method:"PATCH",body:JSON.stringify(b)});currentData.data=d.data;toast("تم حفظ الملف");await loadAll()}catch(e){toast(e.message)}}
function resultsTab(c){const a=currentData.results||[];c.innerHTML='<div class="sectionhead"><h3>النتائج</h3><button class="btn primary" onclick="addResult()">＋ إضافة</button></div>'+(a.length?a.map(r=>'<div class="panel"><b>'+esc(r.levels?.name_ar||"نتيجة")+'</b><div>الدرجة: '+esc(r.score)+' / '+esc(r.total_points)+' — '+esc(r.percentage||"—")+'%</div><div class="mini">'+esc(r.result_status||"")+'</div></div>').join(""):'<div class="empty">لا توجد نتائج.</div>')}
async function addResult(){const score=prompt("الدرجة:");if(score===null)return;const total=prompt("الدرجة الكلية:","100");if(total===null)return;const pct=Number(total)?Number(score)/Number(total)*100:0;try{await api("/student_progress",{method:"POST",body:JSON.stringify({student_id:current,level_id:currentData.data.level_id,status:pct>=60?"passed":"failed",result_score:pct,grade:pct>=90?"ممتاز":pct>=80?"جيد جدًا":pct>=70?"جيد":pct>=60?"مقبول":"غير مجتاز"})});toast("تم حفظ النتيجة");const d=await api("/student/"+current);currentData=d;resultsTab(document.getElementById("modalContent"))}catch(e){toast(e.message)}}
function attendanceTab(c){const a=currentData.attendance||[];c.innerHTML='<div class="sectionhead"><h3>الحضور</h3><button class="btn primary" onclick="addAttendance()">＋ تسجيل</button></div><div class="tablewrap"><table class="table"><tr><th>التاريخ</th><th>المسار</th><th>الحالة</th><th>التأخر</th><th>ملاحظة</th></tr>'+(a.map(r=>'<tr><td>'+esc(r.session_date)+'</td><td>'+esc(r.track_code||"")+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.minutes_late||0)+'</td><td>'+esc(r.note||"")+'</td></tr>').join("")||'<tr><td colspan="5" class="empty">لا توجد سجلات.</td></tr>')+'</table></div>'}
async function addAttendance(){const date=prompt("تاريخ الجلسة YYYY-MM-DD",new Date().toISOString().slice(0,10));if(!date)return;const status=prompt("present / absent / late / excused","present");if(!status)return;const track=prompt("رمز المسار");try{await api("/attendance_records",{method:"POST",body:JSON.stringify({student_id:current,session_date:date,status,track_code:track||null})});toast("تم التسجيل");const d=await api("/student/"+current);currentData=d;attendanceTab(document.getElementById("modalContent"))}catch(e){toast(e.message)}}
function achTab(c){const a=currentData.achievements||[];c.innerHTML='<div class="sectionhead"><h3>الإنجازات</h3><button class="btn primary" onclick="addAch()">＋ إضافة</button></div>'+(a.map(r=>'<div class="panel"><b>'+esc(r.title)+'</b><div>'+esc(r.description||"")+'</div><div class="mini">'+esc(r.achievement_type||"")+' • '+esc(r.achieved_on||"")+'</div></div>').join("")||'<div class="empty">لا توجد إنجازات.</div>')}
async function addAch(){const title=prompt("عنوان الإنجاز");if(!title)return;const desc=prompt("الوصف","");try{await api("/student_achievements",{method:"POST",body:JSON.stringify({student_id:current,title,description:desc,achievement_type:"إنجاز"})});toast("تمت الإضافة");const d=await api("/student/"+current);currentData=d;achTab(document.getElementById("modalContent"))}catch(e){toast(e.message)}}
function progressTab(c){const a=currentData.progress||[];c.innerHTML='<h3>التقدم</h3>'+(a.map(r=>'<div class="panel"><b>'+esc(r.levels?.name_ar||"")+'</b><div>المسار: '+esc(r.track_code||"—")+'</div><div>الحالة: '+esc(r.status||"—")+' • '+esc(r.result_score??"—")+' • '+esc(r.grade||"—")+'</div></div>').join("")||'<div class="empty">لا توجد بيانات.</div>')}
function notesTab(c){const a=currentData.notes||[];c.innerHTML='<div class="sectionhead"><h3>ملاحظات الإدارة</h3><button class="btn primary" onclick="addNote()">＋ إضافة</button></div>'+(a.map(r=>'<div class="panel">'+esc(r.note)+'<div class="mini">'+esc(r.visibility||"admin")+'</div></div>').join("")||'<div class="empty">لا توجد ملاحظات.</div>')}
async function addNote(){const note=prompt("الملاحظة");if(!note)return;try{await api("/student_notes",{method:"POST",body:JSON.stringify({student_id:current,note,visibility:"admin"})});toast("تمت الإضافة");const d=await api("/student/"+current);currentData=d;notesTab(document.getElementById("modalContent"))}catch(e){toast(e.message)}}
function shareTab(c){c.innerHTML='<div class="sectionhead"><h3>الرابط الخاص بالطالب</h3><button class="btn primary" onclick="createShare()">إنشاء رابط</button></div><p class="mini">الرابط للقراءة فقط ولا يتيح تعديل البيانات.</p><div id="shareResult"></div>'}
async function createShare(){try{const r=await fetch(SHARE+"/admin/share",{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({student_id:current})});const d=await r.json();if(!r.ok)throw Error(d.error||"تعذر إنشاء الرابط");document.getElementById("shareResult").innerHTML='<div class="linkbox"><code id="shareUrl">'+esc(d.share_url)+'</code><button class="btn light" onclick="navigator.clipboard.writeText(document.getElementById(\'shareUrl\').textContent);toast(\'تم نسخ الرابط\')">نسخ</button><button class="btn success" onclick="window.open(\'https://wa.me/?text=\'+encodeURIComponent(\'هذا رابط ملفك الرقمي: \'+document.getElementById(\'shareUrl\').textContent),\'_blank\')">واتساب</button></div>'}catch(e){toast(e.message)}}
function newStudent(){alert("سيتم تفعيل إنشاء الطالب مباشرة بعد استيراد بيانات التسجيلات.");}
function toast(s){const x=document.getElementById("toast");x.textContent=s;x.style.display="block";setTimeout(()=>x.style.display="none",2600)}
document.getElementById("logout").onclick=()=>{localStorage.removeItem("center_admin_token");location.reload()};
token=localStorage.getItem("center_admin_token")||"";if(token)start();
</script></body></html>
