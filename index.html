<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>مركز الشاعر السنغامبي للغة والشعر</title>

<meta name="description"
content="مركز الشاعر السنغامبي للغة والشعر - تعليم اللغة العربية والشعر والكتابة والإلقاء.">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

html{
scroll-behavior:smooth
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f7f6;
color:#17211d;
line-height:1.8
}

a{
text-decoration:none;
color:inherit
}

/* ================= HEADER ================= */

header{
background:linear-gradient(90deg,#123b2a,#236448,#9a7630);
color:#fff;
padding:12px 6%;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
position:sticky;
top:0;
z-index:20;
box-shadow:0 3px 18px #0002
}

.brand{
display:flex;
align-items:center;
gap:11px
}

.brand img{
width:52px;
height:52px;
object-fit:contain;
background:#fff;
border-radius:50%;
padding:3px
}

.brand-name{
font-size:18px;
font-weight:bold
}

nav{
display:flex;
gap:9px 15px;
flex-wrap:wrap;
align-items:center
}

nav a{
font-size:13px;
color:#fff
}

nav a:hover{
opacity:.75
}

.nav-admin{
border:1px solid #ffffff99;
padding:6px 12px;
border-radius:8px
}

/* ================= HERO ================= */

.hero{
background:
radial-gradient(circle at top,#2e7d5a,#123b2a 58%,#0b291e);
color:#fff;
text-align:center;
padding:70px 18px 85px
}

.hero-logo{
width:155px;
height:155px;
object-fit:contain;
background:#fff;
border-radius:50%;
padding:8px;
box-shadow:0 12px 35px #0004;
margin-bottom:20px
}

.badge{
display:inline-block;
border:1px solid #ffffff80;
border-radius:30px;
padding:5px 15px;
font-size:13px;
margin-bottom:15px
}

.hero h1{
font-size:40px;
margin-bottom:15px
}

.hero p{
max-width:820px;
margin:auto;
font-size:18px;
opacity:.95
}

.buttons{
margin-top:26px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap
}

/* ================= BUTTONS ================= */

.btn{
display:inline-block;
padding:11px 21px;
border-radius:9px;
font-weight:bold;
border:0;
cursor:pointer;
font-family:inherit
}

.white{
background:#fff;
color:#123b2a
}

.outline{
border:1px solid #fff;
color:#fff;
background:transparent
}

.green{
background:#123b2a;
color:#fff
}

.gold{
background:#b28732;
color:#fff
}

/* ================= GENERAL ================= */

section{
padding:68px 6%
}

.section-title{
text-align:center;
margin-bottom:38px
}

.section-title h2{
color:#123b2a;
font-size:30px;
margin-bottom:6px
}

.section-title p{
color:#6b7670
}

/* ================= CARDS ================= */

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.card,
.about-box,
.program,
.announcement,
.contact-card{
background:#fff;
border:1px solid #e0e8e3;
border-radius:16px;
padding:26px;
box-shadow:0 7px 25px #00000008
}

.num{
width:43px;
height:43px;
border-radius:50%;
background:#e9f2ed;
color:#123b2a;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
margin-bottom:15px
}

.card h3,
.program h3,
.about-box h3{
color:#123b2a;
margin-bottom:9px
}

.card p,
.program p,
.about-box p{
color:#5b6660;
font-size:15px
}

/
